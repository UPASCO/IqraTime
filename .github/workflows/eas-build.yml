# Lance un build EAS (cloud Expo) depuis GitHub Actions — le conteneur des
# sessions Claude Code n'a pas accès à api.expo.dev, ce workflow sert donc
# de relais : Claude (ou toi, via l'onglet Actions → "Run workflow") le
# déclenche, GitHub parle à EAS, et la compilation tourne chez Expo.
#
# Secrets à configurer une seule fois (Settings → Secrets and variables →
# Actions) :
#   EXPO_TOKEN                  requis — jeton créé sur
#                               https://expo.dev/settings/access-tokens
#   PLAY_SERVICE_ACCOUNT_JSON   optionnel — contenu du fichier
#                               secrets/play-service-account.json, requis
#                               uniquement pour la soumission Android
#                               automatique (submit=true).
#
# Le job n'attend pas la fin de la compilation (--no-wait) : EAS met le
# build en file côté Expo et, avec submit=true, l'envoie lui-même aux
# stores une fois terminé (--auto-submit). Suivi : https://expo.dev →
# projet IqraTime → Builds.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à compiler"
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: "Profil eas.json"
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: "Soumettre aux stores à la fin du build (auto-submit)"
        type: boolean
        default: false

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, pas 20 : eas-cli récent (via @oclif/plugin-autocomplete) exige
      # Node >= 22 ; le projet lui-même demande seulement >= 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # La soumission Android lit ./secrets/play-service-account.json
      # (eas.json → submit.production.android.serviceAccountKeyPath). Le
      # fichier n'est jamais commité ; il est reconstitué ici depuis le
      # secret GitHub, uniquement le temps du job.
      - name: Restaurer la clé de service Google Play
        if: ${{ inputs.submit && inputs.platform != 'ios' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Le secret PLAY_SERVICE_ACCOUNT_JSON est vide — la soumission Android automatique échouera. Ajoute-le, ou relance avec submit=false et soumets depuis le dashboard EAS."
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > secrets/play-service-account.json

      - name: Lancer le build EAS
        run: >-
          eas build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive
          --no-wait
          ${{ inputs.submit && '--auto-submit' || '' }}
