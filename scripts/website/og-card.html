<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    font-family:"Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(120% 140% at 18% -10%, #2F6B55 0%, #12372A 45%, #081C13 100%);
    color:#FFFCF5;
    display:flex; align-items:center; gap:56px;
    padding:0 72px;
    position:relative;
  }
  .glow {
    position:absolute; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(200,164,93,0.18) 0%, rgba(200,164,93,0) 62%);
    right:-180px; top:-160px;
  }
  .left { flex:1.15; position:relative; z-index:2; }
  .kicker {
    color:#E4C170; font-size:23px; font-weight:600; letter-spacing:.02em;
    margin-bottom:18px;
  }
  h1 { font-size:62px; line-height:1.1; letter-spacing:-.01em; margin-bottom:22px; }
  p.lead { font-size:26px; line-height:1.45; color:#F7F3E8; opacity:.9; max-width:22ch; }
  .brandrow {
    display:flex; align-items:center; gap:16px; margin-top:34px;
  }
  .brandrow img { width:60px; height:60px; border-radius:14px; box-shadow:0 8px 22px rgba(0,0,0,.4); }
  .brandrow .name { font-size:31px; font-weight:700; letter-spacing:-.01em; }
  .brandrow .url { font-size:20px; color:#C8A45D; margin-top:2px; }

  .right { flex:.85; display:flex; justify-content:center; position:relative; z-index:2; }
  .phone {
    width:265px; aspect-ratio:9/18.6; border-radius:38px;
    background:linear-gradient(160deg,#081C13,#12372A);
    border:9px solid rgba(247,243,232,.14);
    box-shadow:0 34px 70px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:17px; padding:30px 24px;
  }
  .ar { font-size:34px; color:#E4C170; font-weight:600; line-height:1.5; }
  .tr { font-size:17px; color:#F7F3E8; opacity:.86; line-height:1.4; }
  .ref { font-size:14px; color:#C8A45D; letter-spacing:.05em; text-transform:uppercase; margin-top:6px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="kicker">اقرأ · Iqra — « Lis ! »</div>
    <h1>Et si le Coran<br />venait à vous ?</h1>
    <p class="lead">Une āyah ou un hadith authentique sur votre écran verrouillé, chaque heure.</p>
    <div class="brandrow">
      <img src="icon.png" alt="" />
      <div>
        <div class="name">IqraTime</div>
        <div class="url">iqratime.com</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="phone">
      <div class="ar">وَبَشِّرِ الصَّابِرِينَ</div>
      <div class="tr">« Et fais bonne annonce aux endurants. »</div>
      <div class="ref">Al-Baqarah, 2:155</div>
    </div>
  </div>
</body>
</html>
