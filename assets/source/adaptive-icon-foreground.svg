<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>AyahNow Android adaptive icon foreground (transparent background, glyph within safe zone)</title>
  <desc>Same scene as icon.svg minus the sky, scaled into Android's adaptive-icon safe zone; the deep-green background is supplied by adaptiveIcon.backgroundColor in app.config.ts.</desc>
  <defs>
    <radialGradient id="aGlow" cx="50%" cy="62%" r="52%">
      <stop offset="0" stop-color="#F6E1A8" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#C8A45D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C8A45D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEEC4"/>
      <stop offset="0.45" stop-color="#E4C170"/>
      <stop offset="1" stop-color="#A9782F"/>
    </linearGradient>
    <linearGradient id="aBeam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFF4D2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F0D08A" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#E4C170" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E4C170" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#E8DBBC"/>
    </linearGradient>
    <linearGradient id="aCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123A2A"/>
      <stop offset="1" stop-color="#082117"/>
    </linearGradient>
    <mask id="aCrescentMask">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="486" r="390" fill="#fff"/>
      <circle cx="512" cy="428" r="356" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(143,143) scale(0.72)">
    <circle cx="512" cy="486" r="390" fill="url(#aGold)" mask="url(#aCrescentMask)" opacity="0.92"/>
    <ellipse cx="512" cy="640" rx="430" ry="400" fill="url(#aGlow)"/>
    <path d="M474,742 L554,742 L700,150 L328,150 Z" fill="url(#aBeam)" opacity="0.55"/>
    <path d="M492,742 L536,742 L604,132 L424,132 Z" fill="url(#aBeam)" opacity="0.75"/>
    <path d="M504,742 L524,742 L546,120 L482,120 Z" fill="url(#aBeam)"/>
    <g fill="#FFF4D2">
      <path d="M512,150 Q518,186 548,196 Q518,206 512,242 Q506,206 476,196 Q506,186 512,150 Z"/>
      <path d="M406,268 Q410,292 428,299 Q410,306 406,330 Q402,306 384,299 Q402,292 406,268 Z" opacity="0.85"/>
      <path d="M624,240 Q628,262 644,268 Q628,274 624,296 Q620,274 604,268 Q620,262 624,240 Z" opacity="0.8"/>
      <circle cx="452" cy="392" r="6" opacity="0.75"/>
      <circle cx="586" cy="356" r="7" opacity="0.8"/>
      <circle cx="540" cy="470" r="5" opacity="0.6"/>
      <circle cx="470" cy="520" r="4.5" opacity="0.5"/>
    </g>
    <g>
      <path d="M512,754 C428,742 336,764 296,796 L296,868 C336,842 428,824 512,836 Z" fill="url(#aCover)" stroke="url(#aGold)" stroke-width="6"/>
      <path d="M512,754 C596,742 688,764 728,796 L728,868 C688,842 596,824 512,836 Z" fill="url(#aCover)" stroke="url(#aGold)" stroke-width="6"/>
      <path d="M512,746 C432,730 348,748 312,780 C352,758 436,748 512,762 Z" fill="url(#aPage)"/>
      <path d="M512,746 C592,730 676,748 712,780 C672,758 588,748 512,762 Z" fill="url(#aPage)"/>
      <path d="M512,762 C436,748 352,758 312,780 C352,766 436,760 512,774 Z" fill="#D8C79C" opacity="0.8"/>
      <path d="M512,762 C588,748 672,758 712,780 C672,766 588,760 512,774 Z" fill="#D8C79C" opacity="0.8"/>
      <rect x="504" y="742" width="16" height="98" rx="7" fill="url(#aGold)"/>
      <g stroke="url(#aGold)" stroke-width="3.5" fill="none" opacity="0.85">
