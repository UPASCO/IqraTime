<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>IqraTime splash mark — the icon scene inside a night badge, so it reads on the ivory splash background</title>
  <defs>
    <linearGradient id="sSky" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0B2419"/>
      <stop offset="1" stop-color="#040D08"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="50%" cy="62%" r="52%">
      <stop offset="0" stop-color="#F6E1A8" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#C8A45D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C8A45D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEEC4"/>
      <stop offset="0.45" stop-color="#E4C170"/>
      <stop offset="1" stop-color="#A9782F"/>
    </linearGradient>
    <linearGradient id="sBeam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFF4D2" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#F0D08A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E4C170" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#E8DBBC"/>
    </linearGradient>
    <clipPath id="sBadge"><circle cx="256" cy="256" r="248"/></clipPath>
    <mask id="sCrescentMask">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="243" r="195" fill="#fff"/>
      <circle cx="256" cy="214" r="178" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#sBadge)">
    <rect width="512" height="512" fill="url(#sSky)"/>
    <circle cx="256" cy="243" r="195" fill="url(#sGold)" mask="url(#sCrescentMask)" opacity="0.92"/>
    <ellipse cx="256" cy="320" rx="215" ry="200" fill="url(#sGlow)"/>
    <path d="M237,371 L277,371 L350,75 L164,75 Z" fill="url(#sBeam)" opacity="0.55"/>
    <path d="M252,371 L274,371 L302,66 L212,66 Z" fill="url(#sBeam)"/>
    <g fill="#FFF4D2">
      <path d="M256,75 Q259,93 274,98 Q259,103 256,121 Q253,103 238,98 Q253,93 256,75 Z"/>
      <circle cx="203" cy="150" r="3.5" opacity="0.75"/>
      <circle cx="293" cy="132" r="4" opacity="0.8"/>
      <circle cx="270" cy="196" r="3" opacity="0.6"/>
    </g>
    <path d="M256,377 C214,371 168,382 148,398 L148,434 C168,421 214,412 256,418 Z" fill="#0A2318" stroke="url(#sGold)" stroke-width="3"/>
    <path d="M256,377 C298,371 344,382 364,398 L364,434 C344,421 298,412 256,418 Z" fill="#0A2318" stroke="url(#sGold)" stroke-width="3"/>
    <path d="M256,373 C216,365 174,374 156,390 C176,379 218,374 256,381 Z" fill="url(#sPage)"/>
    <path d="M256,373 C296,365 338,374 356,390 C336,379 294,374 256,381 Z" fill="url(#sPage)"/>
    <rect x="252" y="371" width="8" height="49" rx="3.5" fill="url(#sGold)"/>
  </g>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#sGold)" stroke-width="3" opacity="0.5"/>
</svg>
