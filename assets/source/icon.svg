<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>AyahNow app icon — open Qur'an with a light-ray accent</title>
  <rect width="1024" height="1024" fill="#12372A"/>
  <g transform="translate(22,62)">
    <!-- subtle light-ray accent, top-left -->
    <g stroke="#C8A45D" stroke-width="14" stroke-linecap="round" opacity="0.85">
      <line x1="330" y1="230" x2="330" y2="150"/>
      <line x1="270" y1="260" x2="210" y2="200"/>
      <line x1="360" y1="290" x2="430" y2="230"/>
    </g>
    <!-- open book (Qur'an), two pages meeting at a gold spine -->
    <path d="M512,310 C380,310 222,380 222,520 C222,660 380,730 512,730 Z" fill="#F7F3E8"/>
    <path d="M512,310 C644,310 802,380 802,520 C802,660 644,730 512,730 Z" fill="#F7F3E8"/>
    <rect x="503" y="308" width="18" height="424" rx="8" fill="#C8A45D"/>
    <!-- bookmark ribbon -->
    <path d="M499,312 L525,312 L525,232 L512,252 L499,232 Z" fill="#C8A45D"/>
    <!-- abstract text lines, never real script -->
    <g fill="#12372A" opacity="0.3">
      <rect x="290" y="430" width="170" height="16" rx="8"/>
      <rect x="290" y="470" width="170" height="16" rx="8"/>
      <rect x="290" y="510" width="130" height="16" rx="8"/>
      <rect x="564" y="430" width="170" height="16" rx="8"/>
      <rect x="564" y="470" width="170" height="16" rx="8"/>
      <rect x="604" y="510" width="130" height="16" rx="8"/>
    </g>
  </g>
</svg>
