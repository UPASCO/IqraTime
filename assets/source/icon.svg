<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>IQRAnow app icon — an ornate open Qur'an beneath a golden crescent, light rising from its pages</title>
  <desc>Deliberately contains no Arabic lettering: rendering decorative pseudo-Arabic on a Qur'an app icon would put meaningless glyphs where scripture is implied. The rising light and sparks carry the idea instead.</desc>
  <defs>
    <linearGradient id="sky" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0B2419"/>
      <stop offset="0.55" stop-color="#08190F"/>
      <stop offset="1" stop-color="#040D08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="52%">
      <stop offset="0" stop-color="#F6E1A8" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#C8A45D" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C8A45D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEEC4"/>
      <stop offset="0.45" stop-color="#E4C170"/>
      <stop offset="1" stop-color="#A9782F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFF4D2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F0D08A" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#E4C170" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E4C170" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="1" stop-color="#E8DBBC"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123A2A"/>
      <stop offset="1" stop-color="#082117"/>
    </linearGradient>
    <mask id="crescentMask">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="486" r="390" fill="#fff"/>
      <circle cx="512" cy="428" r="356" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="486" r="390" fill="url(#gold)" mask="url(#crescentMask)" opacity="0.92"/>
  <ellipse cx="512" cy="640" rx="430" ry="400" fill="url(#glow)"/>

  <!-- light rising from the open pages -->
  <path d="M474,742 L554,742 L700,150 L328,150 Z" fill="url(#beam)" opacity="0.55"/>
  <path d="M492,742 L536,742 L604,132 L424,132 Z" fill="url(#beam)" opacity="0.75"/>
  <path d="M504,742 L524,742 L546,120 L482,120 Z" fill="url(#beam)"/>

  <!-- sparks carried up by the light -->
  <g fill="#FFF4D2">
    <path d="M512,150 Q518,186 548,196 Q518,206 512,242 Q506,206 476,196 Q506,186 512,150 Z"/>
    <path d="M406,268 Q410,292 428,299 Q410,306 406,330 Q402,306 384,299 Q402,292 406,268 Z" opacity="0.85"/>
    <path d="M624,240 Q628,262 644,268 Q628,274 624,296 Q620,274 604,268 Q620,262 624,240 Z" opacity="0.8"/>
    <circle cx="452" cy="392" r="6" opacity="0.75"/>
    <circle cx="586" cy="356" r="7" opacity="0.8"/>
    <circle cx="540" cy="470" r="5" opacity="0.6"/>
    <circle cx="470" cy="520" r="4.5" opacity="0.5"/>
    <circle cx="360" cy="196" r="5" opacity="0.55"/>
    <circle cx="672" cy="180" r="4.5" opacity="0.5"/>
  </g>

  <!-- open Qur'an -->
  <g>
    <path d="M512,754 C428,742 336,764 296,796 L296,868 C336,842 428,824 512,836 Z" fill="url(#cover)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M512,754 C596,742 688,764 728,796 L728,868 C688,842 596,824 512,836 Z" fill="url(#cover)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M512,746 C432,730 348,748 312,780 C352,758 436,748 512,762 Z" fill="url(#page)"/>
    <path d="M512,746 C592,730 676,748 712,780 C672,758 588,748 512,762 Z" fill="url(#page)"/>
    <path d="M512,762 C436,748 352,758 312,780 C352,766 436,760 512,774 Z" fill="#D8C79C" opacity="0.8"/>
    <path d="M512,762 C588,748 672,758 712,780 C672,766 588,760 512,774 Z" fill="#D8C79C" opacity="0.8"/>
    <rect x="504" y="742" width="16" height="98" rx="7" fill="url(#gold)"/>
    <!-- ornament on each cover -->
    <g stroke="url(#gold)" stroke-width="3.5" fill="none" opacity="0.85">
      <path d="M404,800 l22,-14 22,14 -22,14 z"/>
      <path d="M576,800 l22,-14 22,14 -22,14 z"/>
    </g>
  </g>
</svg>
